name: Build APK Release

permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Vite
        run: pnpm build
        env:
          VITE_API_URL: https://api.vokyvo.com/api
          VITE_WS_URL: wss://ws.vokyvo.com/ws/chat/

      - name: Install Capacitor
        run: pnpm add -D @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/splash-screen@7 @capacitor/browser@7 @capacitor/network@7 @capacitor/status-bar@7 @capacitor/push-notifications@7 && pnpm add onesignal-cordova-plugin

      - name: Init Capacitor
        run: npx cap init VOKYVO com.vokyvo.labs --web-dir=dist || echo "capacitor.config.ts existe deja"

      - name: Add Android
        run: npx cap add android


      - name: Copier les icones VOKYVO
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-icons/mipmap-$density/ic_launcher.png android/app/src/main/res/mipmap-$density/ic_launcher.png
            cp android-icons/mipmap-$density/ic_launcher_round.png android/app/src/main/res/mipmap-$density/ic_launcher_round.png
            cp android-icons/mipmap-$density/ic_launcher_foreground.png android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png
          done
          echo "Icones VOKYVO copiees"
          # Copier les splashes VOKYVO
          cp android-icons/splash/drawable/splash.png android/app/src/main/res/drawable/splash.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-icons/splash/drawable-port-$density/splash.png android/app/src/main/res/drawable-port-$density/splash.png
            cp android-icons/splash/drawable-land-$density/splash.png android/app/src/main/res/drawable-land-$density/splash.png
          done
          echo 'Splash VOKYVO copies'

      - name: Fix styles.xml (fond noir anti-flash blanc)
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            # Remplace toutes les couleurs blanches par #0a0a0f
            sed -i 's|<item name="android:windowBackground">.*</item>|<item name="android:windowBackground">#0a0a0f</item>|' $STYLES
            sed -i 's|<item name="android:colorBackground">.*</item>|<item name="android:colorBackground">#0a0a0f</item>|' $STYLES
            sed -i 's|<item name="colorPrimaryDark">.*</item>|<item name="colorPrimaryDark">#0a0a0f</item>|' $STYLES
            echo "=== styles.xml apres modification ==="
            cat $STYLES
          else
            echo "styles.xml non trouve, SKIP"
          fi

      - name: Debug icones Android
        run: |
          echo '=== Dossiers res ==='
          ls android/app/src/main/res/ | head -20
          echo '=== ic_launcher files ==='
          find android/app/src/main/res -name 'ic_launcher*' | head -30
          echo '=== Contenu xxxhdpi ==='
          echo '=== splash files ==='
          find android/app/src/main/res -name '*splash*' | head -30
          echo '=== drawable ==='
          ls -la android/app/src/main/res/drawable/ 2>/dev/null | head -20
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ 2>/dev/null || echo 'pas de dossier xxxhdpi'




      - name: Injecter la version dans build.gradle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(echo $VERSION | tr -d '.')
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "'$VERSION'"/' android/app/build.gradle
          echo "Version injectée : $VERSION (code $VERSION_CODE)"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Google Services
        run: |
          cp google-services.json android/app/google-services.json

      - name: Add Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <application/' $MANIFEST

      - name: Add App Links (deep link OAuth)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 << 'PYEOF_INNER'
import re
with open("android/app/src/main/AndroidManifest.xml", "r") as f:
    content = f.read()

# Bloc intent-filter pour App Links vokyvo.com
app_links = '''
                <intent-filter android:autoVerify="true">
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data android:scheme="https" android:host="vokyvo.com" android:pathPrefix="/oauth-callback" />
                </intent-filter>
'''

# Chercher une activite MAIN/LAUNCHER et ajouter l'intent-filter juste apres
pattern = r'(<intent-filter>\s*<action android:name="android\.intent\.action\.MAIN"[^>]*\/>\s*<category android:name="android\.intent\.category\.LAUNCHER"[^>]*\/>\s*<\/intent-filter>)'
match = re.search(pattern, content)

if match:
    content = content.replace(match.group(1), match.group(1) + app_links)
    with open("android/app/src/main/AndroidManifest.xml", "w") as f:
        f.write(content)
    print("OK: App Links ajoute")
else:
    print("ATTENTION: intent-filter MAIN/LAUNCHER non trouve")
    print("Contenu actuel du manifest (extrait):")
    print(content[:2000])
PYEOF_INNER
          echo "=== AndroidManifest apres modif ==="
          cat $MANIFEST | head -60


      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/vokyvo-release.keystore

      - name: Configure Release Signing
        run: |
          cd android
          printf 'android {\n    signingConfigs {\n        release {\n            storeFile file("vokyvo-release.keystore")\n            storePassword System.getenv("STORE_PASS")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASS")\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\n' > app/signing.gradle
          echo "apply from: 'signing.gradle'" >> app/build.gradle

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Renommer APK en vokyvo.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/vokyvo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vokyvo-release
          path: android/app/build/outputs/apk/release/vokyvo.apk

      - name: Lire la version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version détectée : $VERSION"

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: VOKYVO v${{ steps.version.outputs.version }}
          files: android/app/build/outputs/apk/release/vokyvo.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notifier le backend
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LIEN="https://github.com/aron733/frontend/releases/download/v${VERSION}/vokyvo.apk"
          curl -X POST https://api.vokyvo.com/api/webhook/release/ \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.RELEASE_WEBHOOK_TOKEN }}\",\"version\":\"${VERSION}\",\"lien\":\"${LIEN}\"}"
          echo "Webhook envoyé pour version $VERSION"
