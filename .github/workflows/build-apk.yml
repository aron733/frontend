name: Build APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Vite
        run: pnpm build
        env:
          VITE_API_URL: https://django-43v1.onrender.com/api

      - name: Install Capacitor
        run: pnpm add -D @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7

      - name: Install Push Notifications Plugin
        run: pnpm add @capacitor/push-notifications@7

      - name: Init Capacitor
        run: npx cap init VOKYVO com.vokyvo.labs --web-dir=dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Firebase Config
        run: |
          cp google-services.json android/app/google-services.json
          cp google-services.json android/app/src/main/google-services.json

      - name: Add Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' $MANIFEST

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Firebase in MainActivity
        run: |
          cd android
          MAIN_ACTIVITY=$(find . -path "*/MainActivity.java" | head -1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            # Ajoute FirebaseApp.initializeApp au onCreate
            sed -i 's/import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport com.google.firebase.FirebaseApp;/' $MAIN_ACTIVITY
            sed -i 's/super.onCreate(savedInstanceState);/super.onCreate(savedInstanceState);\n        FirebaseApp.initializeApp(this);/' $MAIN_ACTIVITY
            cat $MAIN_ACTIVITY
          fi

      - name: Add Firebase Dependencies
        run: |
          python3 configure-firebase.py


      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/vokyvo-release.keystore

      - name: Configure Release Signing
        run: |
          cd android
          printf 'android {\n    signingConfigs {\n        release {\n            storeFile file("vokyvo-release.keystore")\n            storePassword System.getenv("STORE_PASS")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASS")\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\n' > app/signing.gradle
          echo "apply from: 'signing.gradle'" >> app/build.gradle

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vokyvo-release
          path: android/app/build/outputs/apk/release/app-release.apk
