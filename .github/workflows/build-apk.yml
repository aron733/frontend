name: Build APK Release

permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Vite
        run: pnpm build
        env:
          VITE_API_URL: https://django-43v1.onrender.com/api

      - name: Install Capacitor
        run: pnpm add -D @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 && pnpm add onesignal-cordova-plugin

      - name: Init Capacitor
        run: npx cap init VOKYVO com.vokyvo.labs --web-dir=dist

      - name: Add Android
        run: npx cap add android

      - name: Generer les icones VOKYVO
        run: |
          pnpm add -D @capacitor/assets
          mkdir -p resources
          pnpm rebuild sharp
          cp public/vokyvo-icon-1024.png resources/icon.png
          npx capacitor-assets generate --android



      - name: Injecter la version dans build.gradle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(echo $VERSION | tr -d '.')
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "'$VERSION'"/' android/app/build.gradle
          echo "Version injectée : $VERSION (code $VERSION_CODE)"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Google Services
        run: |
          cp google-services.json android/app/google-services.json

      - name: Add Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <application/' $MANIFEST

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/vokyvo-release.keystore

      - name: Configure Release Signing
        run: |
          cd android
          printf 'android {\n    signingConfigs {\n        release {\n            storeFile file("vokyvo-release.keystore")\n            storePassword System.getenv("STORE_PASS")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASS")\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\n' > app/signing.gradle
          echo "apply from: 'signing.gradle'" >> app/build.gradle

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Renommer APK en vokyvo.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/vokyvo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vokyvo-release
          path: android/app/build/outputs/apk/release/vokyvo.apk

      - name: Lire la version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version détectée : $VERSION"

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: VOKYVO v${{ steps.version.outputs.version }}
          files: android/app/build/outputs/apk/release/vokyvo.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notifier le backend
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LIEN="https://github.com/aron733/frontend/releases/download/v${VERSION}/vokyvo.apk"
          curl -X POST https://django-43v1.onrender.com/api/webhook/release/ \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.RELEASE_WEBHOOK_TOKEN }}\",\"version\":\"${VERSION}\",\"lien\":\"${LIEN}\"}"
          echo "Webhook envoyé pour version $VERSION"
