name: Build APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build Vite
        run: pnpm build
        env:
          VITE_API_URL: https://django-43v1.onrender.com/api
      
      - name: Install Capacitor
        run: pnpm add -D @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
      
      - name: Init Capacitor
        run: npx cap init VOKYVO com.vokyvo.app --web-dir=dist
      
      - name: Add Android
        run: npx cap add android
      
      - name: Add Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' $MANIFEST
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          # Lister tous les APK générés
          echo "=== APKs trouvés ==="
          find . -name "*.apk" -type f
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vokyvo-release
          path: android/**/*.apk
