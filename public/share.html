<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partage VOKYVO</title>
<meta name="description" content="Partagé depuis VOKYVO">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#ccc;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
.card{background:#111120;border:1px solid #2a2a3e;border-radius:16px;padding:30px;max-width:400px;width:100%}
.logo{color:#667eea;font-size:24px;font-weight:800;margin-bottom:8px}
.sub{color:#888;font-size:14px;margin-bottom:24px}
.btn{display:inline-block;background:#667eea;color:white;text-decoration:none;padding:14px 24px;border-radius:12px;font-weight:600;font-size:15px;width:100%}
.btn:hover{background:#5566d0}
.info{color:#555;font-size:12px;margin-top:20px;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <div class="logo">VOKYVO</div>
  <div class="sub">Quelqu'un t'a partagé un article</div>
  <a id="lien" href="#" class="btn">Lire l'article complet</a>
  <div id="source" class="info"></div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const url = params.get('url');
  const lien = document.getElementById('lien');
  const source = document.getElementById('source');
  
  if (url) {
    lien.href = url;
    try {
      const domaine = new URL(url).hostname.replace('www.', '');
      source.textContent = 'Source : ' + domaine;
    } catch (e) {
      source.textContent = 'Lien externe';
    }
  } else {
    lien.href = 'https://vokyvo.com';
    lien.textContent = 'Retour à VOKYVO';
    source.textContent = 'Aucun lien fourni.';
  }
</script>
</body>
</html>
