<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1a2e 50%,#16213e 100%);color:#ccc;line-height:1.7;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}

.code{font-size:120px;font-weight:900;color:#1a1a2e;letter-spacing:8px;line-height:1;margin-bottom:20px;text-shadow:0 0 40px rgba(102,126,234,0.3)}

.btn{display:inline-block;padding:14px 32px;border-radius:12px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;text-decoration:none;font-size:15px;font-weight:600;transition:opacity 0.2s;box-shadow:0 6px 20px rgba(102,126,234,0.3)}
.btn:hover{opacity:0.9}
.footer{margin-top:40px;font-size:12px;color:#555}
a.link{color:#667eea;text-decoration:none}
a.link:hover{text-decoration:underline}
